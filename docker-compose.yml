services:
  mysql-particle:
    image: mysql:8.0
    container_name: mysql-particle
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${COMMUNITY_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${COMMUNITY_DB_NAME:-community}
    ports:
      - "${COMMUNITY_DB_PORT:-3306}:3306"
    volumes:
      - mysql-particle-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-particle:
    image: redis:7-alpine
    container_name: redis-particle
    restart: unless-stopped
    ports:
      - "${COMMUNITY_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-particle-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  community-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-backend
    restart: unless-stopped
    environment:
      COMMUNITY_SERVER_PORT: 8080
      COMMUNITY_DB_HOST: mysql-particle
      COMMUNITY_DB_PORT: 3306
      COMMUNITY_DB_NAME: ${COMMUNITY_DB_NAME:-community}
      COMMUNITY_DB_USERNAME: ${COMMUNITY_DB_USERNAME:-root}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-root}
      COMMUNITY_REDIS_HOST: redis-particle
      COMMUNITY_REDIS_PORT: 6379
      COMMUNITY_JWT_SECRET: ${COMMUNITY_JWT_SECRET:-community-jwt-secret-2026-keep-it-safe-x}
      COMMUNITY_JWT_EXPIRE: ${COMMUNITY_JWT_EXPIRE:-604800000}
      COMMUNITY_CORS_ALLOWED_ORIGINS: ${COMMUNITY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${COMMUNITY_SERVER_PORT:-8080}:8080"
    depends_on:
      mysql-particle:
        condition: service_healthy
      redis-particle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-particle-data:
    name: mysql-particle-data
  redis-particle-data:
    name: redis-particle-data
